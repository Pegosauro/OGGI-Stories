<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10121d"><meta name="apple-mobile-web-app-capable" content="yes"><title>OGGI. — Le notizie in stories</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a0c15;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 65% 27%,#3e4b9b 0%,transparent 45%),linear-gradient(145deg,#1c2546,#0c1020 70%);padding:env(safe-area-inset-top) 20px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;transition:background .25s}.progress{display:flex;gap:4px;padding-top:10px}.progress span{height:3px;flex:1;background:#ffffff4a;border-radius:10px}.progress .active{background:#fff}.top{display:flex;align-items:center;justify-content:space-between;margin-top:18px}.brand{font-size:30px;font-weight:900;letter-spacing:-2px}.brand b{color:#9cb7ff}.date{font-size:11px;color:#ccd5e8;letter-spacing:1.3px;text-transform:uppercase}.art{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative}.ring{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#b8c8ff99,#5566ce66 45%,#141b4b33 72%);filter:blur(1px);position:absolute;top:6%;right:-40px;box-shadow:0 0 80px #7089d655}.category{position:relative;align-self:flex-start;border:1px solid #ffffff55;border-radius:30px;padding:8px 13px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:#ffffff18}.content{position:relative;margin-top:auto;padding-bottom:12vh}h1{font-size:clamp(34px,10vw,58px);letter-spacing:-1.8px;line-height:1.06;margin:18px 0}p{font-size:17px;line-height:1.55;color:#e2e7f5;max-width:560px}.source{font-size:12px;color:#c2cce2;margin-top:16px}.bottom{display:flex;align-items:center;gap:10px}.btn{border:1px solid #ffffff55;background:#ffffff1c;color:#fff;border-radius:18px;padding:15px 18px;font-weight:650;font-size:14px;cursor:pointer}.btn.primary{background:#fff;color:#111b34;border-color:#fff;flex:1}.btn:disabled{opacity:.3}.nav{display:flex;gap:8px}.overlay{position:fixed;inset:0;background:#0c1025f5;z-index:10;overflow:auto;padding:calc(35px + env(safe-area-inset-top)) 24px 32px;display:none}.overlay.open{display:block}.overlay h2{font-size:28px}.overlay p{font-size:16px}.overlay a{color:#afc6ff}.close{float:right}.empty{font-size:22px;font-weight:650}.hint{font-size:12px;color:#aebad5;text-align:center;margin:14px 0 0}@media(min-width:700px){.app{max-width:470px;margin:auto;min-height:100dvh;border-left:1px solid #ffffff22;border-right:1px solid #ffffff22}.content{padding-bottom:8vh}}
</style></head><body><main class="app" id="app"><div class="progress" id="progress"></div><div class="top"><div class="brand">OGGI<b>.</b></div><div class="date" id="date">EDIZIONE QUOTIDIANA</div></div><section class="art"><div class="ring"></div><div class="content"><div class="category" id="category">LE NOTIZIE ESSENZIALI</div><h1 id="title">Caricamento delle notizie…</h1><p id="summary">Una storia alla volta.</p><div class="source" id="source"></div></div></section><div class="bottom"><button class="btn" id="prev" aria-label="Precedente">←</button><button class="btn primary" id="detail">Approfondisci</button><button class="btn" id="next" aria-label="Successiva">→</button></div><div class="hint">Scorri a sinistra o destra per cambiare notizia</div></main><section class="overlay" id="overlay" aria-modal="true" role="dialog"><button class="btn close" id="close">Chiudi ×</button><div id="detailContent"></div></section><script>
let articles=[],i=0;const el=id=>document.getElementById(id);
function render(){const a=articles[i];el('date').textContent=window.edition||'EDIZIONE QUOTIDIANA';el('progress').innerHTML=articles.map((_,n)=>'<span class="'+(n===i?'active':'')+'"></span>').join('');el('prev').disabled=i===0;el('next').disabled=i===articles.length-1;el('detail').disabled=!a;if(!a){el('category').textContent='IN ATTESA';el('title').textContent='La prossima edizione è in preparazione';el('summary').textContent='Le notizie compariranno qui dopo la prima pubblicazione del file data/news.json.';el('source').textContent='';return}el('category').textContent=a.category||'Notizie';el('title').textContent=a.title||'';el('summary').textContent=a.summary||'';el('source').textContent=a.source?'Fonte: '+a.source:''}
function move(n){if(i+n>=0&&i+n<articles.length){i+=n;render()}}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);
el('detail').onclick=()=>{const a=articles[i];if(!a)return;el('detailContent').replaceChildren();const h=document.createElement('h2');h.textContent=a.title;el('detailContent').append(h);for(const t of [...(a.facts||[]),...(a.body||[])]){const p=document.createElement('p');p.textContent=t;el('detailContent').append(p)}if(a.url&&a.url.startsWith('https://')){const link=document.createElement('a');link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Leggi la fonte originale ↗';el('detailContent').append(link)}el('overlay').classList.add('open')};
el('close').onclick=()=>el('overlay').classList.remove('open');
let startX=0;el('app').addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});el('app').addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-startX;if(Math.abs(d)>65)move(d<0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')el('overlay').classList.remove('open');if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});
fetch('./data/news.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('fetch');return r.json()}).then(d=>{articles=Array.isArray(d.articles)?d.articles:[];window.edition=d.editionLabel||d.edition||'';render()}).catch(()=>render());render();
</script></body></html>
